get_schedule:
  name: Get Schedule
  description: >
    Read and log the current heating schedule for a thermostat.
    Returns the full schedule as a response and logs each day to home-assistant.log.
  fields:
    device_name:
      name: Thermostat
      description: The name of the thermostat to read.
      required: true
      selector:
        select:
          custom_value: true
          options:
            - "Bathroom"
            - "Dining"
            - "En Suite Bathroom"
            - "Kitchen and Hall"

reload_profiles:
  name: Reload Profiles
  description: >
    Reload heating schedule profiles from heatmiser_schedule_profiles.yaml
    without restarting Home Assistant.
