<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5921E"/>
      <stop offset="100%" stop-color="#C86400"/>
    </linearGradient>
    <linearGradient id="dialGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDEDED"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="256" height="256" rx="40" ry="40" fill="url(#bg)"/>

  <!-- Thermostat outer glow ring -->
  <circle cx="108" cy="110" r="80" fill="none" stroke="white" stroke-width="6" opacity="0.25"/>

  <!-- Thermostat face -->
  <circle cx="108" cy="110" r="72" fill="url(#dialGrad)"/>

  <!-- Temperature arc (active schedule indicator) -->
  <circle cx="108" cy="110" r="80" fill="none" stroke="white" stroke-width="7"
          stroke-dasharray="188 314" stroke-dashoffset="78"
          stroke-linecap="round" opacity="0.85"/>

  <!-- Tick marks -->
  <g stroke="#C86400" stroke-width="3" stroke-linecap="round" opacity="0.5">
    <line x1="108" y1="32" x2="108" y2="44"/>
    <line x1="108" y1="176" x2="108" y2="188"/>
    <line x1="30" y1="110" x2="42" y2="110"/>
    <line x1="174" y1="110" x2="186" y2="110"/>
  </g>

  <!-- Centre hub -->
  <circle cx="108" cy="110" r="16" fill="#F5921E"/>
  <circle cx="108" cy="110" r="7" fill="white"/>

  <!-- Needle pointing to ~21 o'clock (upper-left, representing a warm setpoint) -->
  <line x1="108" y1="110" x2="73" y2="66" stroke="#555" stroke-width="4" stroke-linecap="round"/>

  <!-- Calendar card overlay — dark card bottom-right -->
  <rect x="150" y="148" width="96" height="90" rx="12" fill="#1B2838"/>

  <!-- Calendar header -->
  <rect x="150" y="148" width="96" height="24" rx="12" fill="#F5921E"/>
  <rect x="150" y="160" width="96" height="12" fill="#F5921E"/>

  <!-- Binder rings -->
  <rect x="171" y="139" width="9" height="18" rx="4" fill="#1B2838"/>
  <rect x="219" y="139" width="9" height="18" rx="4" fill="#1B2838"/>

  <!-- Schedule rows (7 rows = 7 days, alternating orange/dark bars) -->
  <rect x="160" y="180" width="34" height="5" rx="2.5" fill="#F5921E"/>
  <rect x="198" y="180" width="40" height="5" rx="2.5" fill="#2C3E50"/>

  <rect x="160" y="191" width="20" height="5" rx="2.5" fill="#2C3E50"/>
  <rect x="184" y="191" width="54" height="5" rx="2.5" fill="#F5921E"/>

  <rect x="160" y="202" width="40" height="5" rx="2.5" fill="#F5921E"/>
  <rect x="204" y="202" width="34" height="5" rx="2.5" fill="#2C3E50"/>

  <rect x="160" y="213" width="26" height="5" rx="2.5" fill="#2C3E50"/>
  <rect x="190" y="213" width="48" height="5" rx="2.5" fill="#F5921E"/>

  <rect x="160" y="224" width="46" height="5" rx="2.5" fill="#F5921E"/>
  <rect x="210" y="224" width="28" height="5" rx="2.5" fill="#2C3E50"/>
</svg>
